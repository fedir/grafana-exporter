# Grafana credentials for the exporter.
#
# Option A — basic auth (username + password):
#   Fill in "username" and "password" below.
#
# Option B — service account token:
#   Leave username/password empty and set "token" instead.
#   Note: tokens cannot authenticate a headless browser session; use basic auth
#   when the Playwright backend is active (i.e. Image Renderer is not installed).
#
# Values here are plain text — Kubernetes base64-encodes them automatically
# when you use `stringData`.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-exporter-credentials
  labels:
    app: grafana-exporter
type: Opaque
stringData:
  username: "admin"
  password: "admin"
  # token: "glsa_YOUR_SERVICE_ACCOUNT_TOKEN"
